variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  PROJECT_DIR: "/home/ubuntu/app"

stages:
- build and push
- deploy

build:
  stage: build and push
  image: docker:20.10.16
  services:
  - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  - docker build -t $IMAGE_NAME:$IMAGE_TAG -f ./app/Dockerfile ./app
  - docker push $IMAGE_NAME:$IMAGE_TAG
  rules:
  - if: '$CI_COMMIT_BRANCH == "gitlab-ci"'

deploy:
  stage: deploy
  needs: [ "build and push" ]
  before_script:
  - chmod 400 "$SSH_PRIVATE_KEY"
  script:
  - |
    scp -o StrictHostKeyChecking=no -i "$SSH_PRIVATE_KEY" \
      docker-compose.yml \
      nginx/nginx.conf \
      ubuntu@52.221.190.129:"$PROJECT_DIR/"

    ssh -o StrictHostKeyChecking=no -i "$SSH_PRIVATE_KEY" ubuntu@52.221.190.129 "
      cd $PROJECT_DIR &&
      echo \"$CI_REGISTRY_PASSWORD\" | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY &&
      IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG docker-compose pull &&
      IMAGE_NAME=$IMAGE_NAME IMAGE_TAG=$IMAGE_TAG docker-compose up -d
    "
  rules:
  - if: '$CI_COMMIT_BRANCH == "gitlab-ci"'
