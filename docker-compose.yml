version: "3.8"

services:
    traefik:
        image: traefik:v3.3
        container_name: traefik
        restart: always
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock:ro"
            - "letsencrypt:/letsencrypt"
        networks:
            - webnet
        command:
            - "--api.dashboard=false"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
            - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
            - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
            - "--certificatesresolvers.letsencrypt.acme.email=korngsamnang168@gmail.com"
            - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
            - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

    nginx:
        image: nginx:alpine
        container_name: nginx
        restart: always
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - app_code:/var/www
        depends_on:
            - app
        networks:
            - webnet
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.nginx.rule=Host(`todayinternet.systems`)"
            - "traefik.http.routers.nginx.entrypoints=websecure"
            - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
            - "traefik.http.services.nginx.loadbalancer.server.port=80"

    app:
        image: "${IMAGE_NAME}:${IMAGE_TAG}"
        restart: unless-stopped
        container_name: app
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_KEY=${APP_KEY:-base64:Ep/TRuHrbtSf1Q5N1LXr5UM2xo3iOVbBTQdjycFWaLg=}
            - DB_CONNECTION=pgsql
            - DB_HOST=db
            - DB_PORT=5432
            - DB_DATABASE=laravel
            - DB_USERNAME=laravel
            - DB_PASSWORD=your_secure_password
        networks:
            - webnet

    db:
        image: postgres:15-alpine
        restart: unless-stopped
        environment:
            - POSTGRES_DB=laravel
            - POSTGRES_USER=laravel
            - POSTGRES_PASSWORD=your_secure_password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - webnet
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U laravel"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    webnet:
        driver: bridge

volumes:
    postgres_data:
    letsencrypt:
    app_code:
